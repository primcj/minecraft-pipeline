spec:
  template:
    spec:
      containers:
      - name: mc-monitor
        image: itzg/mc-monitor
        args: ["export-for-prometheus"]
        env:
        - name: EXPORT_PORT
          value: "8080"
        - name: MC_SERVER_HOST
          value: "localhost"
        - name: MC_SERVER_PORT
          value: "25565"
        ports:
        - containerPort: 8080
          name: metrics
